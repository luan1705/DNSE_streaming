services:

  #---------------------------------------------EBOARD TABLE------------------------------------------------
  eboardinfo:
    build:
      context: .
      dockerfile: Dockerfile
    image: dnse_streaming:latest
    env_file:
      - ../../.env
    container_name: eboardinfo
    command: ["python3", "source/eboard_info.py"]
    networks: [appnet]
    restart: unless-stopped
    volumes:
      - ./List/exchange.py:/app/List/exchange.py:ro

  #---------------------------------------------EBOARD TOP PRICE--------------------------------------------
  eboardtopprice:
    image: dnse_streaming:latest
    env_file:
      - ../../.env
    container_name: eboardtopprice
    command: ["python3", "source/eboard_top_price.py"]
    networks: [appnet]
    restart: unless-stopped
    volumes:
      - ./List/exchange.py:/app/List/exchange.py:ro

  #---------------------------------------------INDICES-----------------------------------------------------
  indices:
    image: dnse_streaming:latest
    env_file:
      - ../../.env
    container_name: indices
    command: ["python3", "source/indices.py"]
    networks: [appnet]
    restart: unless-stopped
    volumes:
      - ./List/indice.py:/app/List/indice.py:ro

  #---------------------------------------------DB WRITER---------------------------------------------------
  dnsewriter:
    image: dnse_streaming:latest
    env_file:
      - ../../.env
    container_name: dnsewriter
    command: ["python3", "db_writer/dnsewriter.py"]
    networks: [appnet]
    restart: unless-stopped

networks:
  appnet:
    driver: bridge